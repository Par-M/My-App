name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The test suite builds its own schema from the migrations, so this step
      # exists to prove the migration chain is runnable end to end and that
      # --check agrees with what a fresh migrate produces.
      - name: Apply migrations to a scratch database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/myapp_migrate_check
        run: |
          python -c "
          import psycopg
          c = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True)
          c.execute('CREATE DATABASE myapp_migrate_check')
          c.close()
          "
          python -m scripts.migrate
          python -m scripts.migrate --check

      # tests/conftest.py builds the schema from the Alembic migrations into
      # the disposable TEST_DATABASE_URL and truncates between tests. Setting
      # DATABASE_URL is still required for the app's own Settings, but the
      # suite never reads it as its test target.
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/myapp_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/myapp_test
        run: python -m pytest tests -q
